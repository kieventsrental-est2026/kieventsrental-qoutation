<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KI Events Rental Quotation</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #f0f4f8;
    margin: 20px;
    color: #333;
  }
  header {
    text-align: center;
    padding: 20px;
  }
  header h1 {
    font-size: 2em;
    margin: 0;
    color: #2c3e50;
  }
  /* Container for items */
  #itemsContainer {
    margin-top: 30px;
  }
  /* Card style for each item row */
  .item-card {
    background: #fff;
    padding: 15px 20px;
    margin-bottom: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  select, input[type=number] {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    flex: 1;
  }
  /* Buttons style */
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }
  .btn:hover {
    opacity: 0.9;
  }
  #addBtn {
    background-color: #27ae60;
    color: #fff;
  }
  #calcBtn {
    background-color: #2980b9;
    color: #fff;
  }
  /* Total display style */
  #total {
    margin-top: 30px;
    background: #dfe6e9;
    padding: 20px;
    border-radius: 8px;
    font-size: 1.5em;
    font-weight: bold;
    text-align: center;
  }
  /* Delivery fee input style */
  #deliveryFeeContainer {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #deliveryFeeContainer input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 100px;
  }
</style>
</head>
<body>

<header>
  <h1>KI Events Rental Quotation</h1>
  <p>Get instant quotes in just a few clicks!</p>
</header>

<div id="itemsContainer"></div>

<div style="margin-top:20px; display:flex; gap:10px;">
  <button id="addBtn" class="btn" onclick="addItem()">Add Item</button>
  <button id="calcBtn" class="btn" onclick="calculateTotal()">Calculate Total</button>
</div>

<div id="deliveryFeeContainer">
  <label for="deliveryFee"><strong>Delivery & Return Fee:</strong> ₱</label>
  <input type="number" id="deliveryFee" min="0" value="0" />
</div>

<div id="total">Total: ₱0</div>

<script>
  // Sample catalog list
  const catalog = [
    { name: "Set A", price: 680 },
    { name: "Set B", price: 1015 },
    { name: "Set C", price: 1340 },
    { name: "Set D", price: 1675 },
    { name: "Monoblocks Chair", price: 15 },
    { name: "Chair Cover", price: 15 },
    { name: "Long Table 4ft", price: 125 },
    { name: "Long Table Cover 4ft", price: 30 },
    { name: "Long Table 6ft", price: 165 },
    { name: "Long Table Cover 6ft", price: 40 },
    { name: "8 Seater - Round Table with Cover", price: 280 },
    { name: "10 Seater - Round Table with Cover", price: 350 },
    { name: "Runners", price: 20 },
    { name: "Chair Ribbon", price: 20 },
    { name: "Toppers", price: 30 },
    { name: "Centerpiece", price: 20 },
    { name: "Kiddie Set", price: 700 },
    { name: "Kiddie Tables", price: 125 },
    { name: "Kiddie Table Cover", price: 20 },
    { name: "Kiddie Cahir", price: 20 },
    { name: "Chaffing Dish/Foodwarmer", price: 380 },
    { name: "Videoke - Set A (Basic)", price: 999 },
    { name: "Videoke - Set B (Modern)", price: 1399 },
    { name: "Videoke - Set C (Premium)", price: 1899 },
    { name: "Tent 2mx2m", price: 400 },
    { name: "Tent 2mx3m", price: 550 },
    { name: "Tent 3mx4.5m", price: 700 },
    { name: "Tent 4mx6m", price: 950 },
    { name: "Tent Side Cover", price: 50 }
    // ... add your items here
  ];

  function createItemCard() {
    const card = document.createElement('div');
    card.className = 'item-card';

    const select = document.createElement('select');
    const defaultOpt = document.createElement('option');
    defaultOpt.text = '-- Select an item --';
    defaultOpt.disabled = true;
    defaultOpt.selected = true;
    defaultOpt.value = "";
    select.appendChild(defaultOpt);
    catalog.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.price;
      opt.text = `${item.name} (₱${item.price})`;
      select.appendChild(opt);
    });

    const qty = document.createElement('input');
    qty.type = 'number';
    qty.min = '1';
    qty.value = '1';

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';
    removeBtn.className = 'btn';
    removeBtn.style.backgroundColor = '#FFCCCB';
    removeBtn.onclick = () => {
      card.remove();
    };

    // Append elements to card
    card.appendChild(select);
    card.appendChild(qty);
    card.appendChild(removeBtn);
    return card;
  }

  function addItem() {
    const container = document.getElementById('itemsContainer');
    container.appendChild(createItemCard());
  }

  function calculateTotal() {
    const rows = document.querySelectorAll('.item-card');
    let totalItems = 0;

    rows.forEach(row => {
      const select = row.querySelector('select');
      const qty = row.querySelector('input[type=number]');
      const price = parseFloat(select.value);
      const quantity = parseInt(qty.value) || 0;
      if (select.value) {
        totalItems += price * quantity;
      }
    });

    const deliveryFee = parseFloat(document.getElementById('deliveryFee').value) || 0;
    const total = totalItems + deliveryFee;
    document.getElementById('total').innerText = `Total: ₱${total.toFixed(2)}`;
  }

  // Load initial item
  window.onload = () => {
    addItem();
  };
</script>

</body>
</html>
